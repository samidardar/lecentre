[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callwiz"
version = "0.1.0"
description = "CallWiz AI — centre d'appels IA inbound/outbound temps réel"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "typer>=0.12",
    "prometheus-client>=0.20",
    "google-genai>=1.0",
    "langgraph>=0.3",
    "qdrant-client>=1.9",
    "numpy>=1.24",
    "audioop-lts>=0.2; python_version>='3.13'",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
prod = ["asyncpg>=0.29", "redis>=5.0"]
docs = ["pypdf>=4.0", "python-docx>=1.1"]
mcp = ["mcp>=1.2"]
embeddings = ["fastembed>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pypdf>=4.0", "python-docx>=1.1"]

[project.scripts]
callwiz = "cli.main:app"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
